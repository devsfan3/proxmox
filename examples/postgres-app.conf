# Example: an app backed by PostgreSQL.
SERVICES=(myapp)
DATA_PATHS=(
  /opt/myapp
  /etc/myapp
)
# Dumped with pg_dumpall on the old CT, replayed with psql on the new one.
# Never list /var/lib/postgresql in DATA_PATHS - PG 15 -> 17 will not start.
DB_TYPE="postgres"
PROVISION_CMD='apt-get install -y postgresql myapp'
CHOWN_MAP=("myapp:myapp /opt/myapp")
POST_RESTORE_CMD='systemctl enable myapp'
