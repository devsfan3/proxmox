# ---------------------------------------------------------------------------
# Per-app config for rebuild-lxc-trixie.sh.  Copy one of these per container.
# It is sourced by bash, so it is shell syntax - quote things.
# ---------------------------------------------------------------------------

# Services to stop before reading the data and before writing it back.
SERVICES=(jellyfin)

# Everything that must survive. Absolute paths, as seen inside the container.
# Include the app's sqlite DB here; only postgres/mysql need DB_TYPE below.
DATA_PATHS=(
  /var/lib/jellyfin
  /etc/jellyfin
)

# none | postgres | mysql   - dumped with pg_dumpall / mysqldump, not copied.
DB_TYPE="none"

# How the app gets installed into the fresh Debian 13 container.
# A community helper script, or just apt - whatever builds a working install.
PROVISION_CMD='apt-get install -y --no-install-recommends jellyfin'

# Ownership to reassert after extraction, "user:group /path" per entry.
CHOWN_MAP=(
  "jellyfin:jellyfin /var/lib/jellyfin"
  "jellyfin:jellyfin /etc/jellyfin"
)

# Anything else once the data is in place.
POST_RESTORE_CMD='systemctl enable jellyfin'
